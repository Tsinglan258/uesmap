  g.lines.forEach(function(line){
    panelHtml += '<div class="stu-line">' + line + '</div>';
  });
  panelHtml += '</div>';
});
document.getElementById('panel-content').innerHTML = panelHtml;

// ---------- 地图 ----------
var chart = echarts.init(document.getElementById('map'));

var NANNING = DATA.nanning;

// 按城市聚合，避免同城市多条重线，同时汇总人数用于点大小/tooltip
var cityMap = {};
DATA.domestic.forEach(function(d){
  var key = d.city;
  if(!cityMap[key]){
    cityMap[key] = { name: d.city, coord: d.coord, students: [] };
  }
  cityMap[key].students.push(d.name);
});

var scatterData = [];
var lineData = [];
Object.keys(cityMap).forEach(function(key){
  var c = cityMap[key];
  scatterData.push({
    name: c.name,
    value: c.coord.concat([c.students.length]),
    students: c.students
  });
  if(c.name !== '南宁市'){
    lineData.push({
      coords: [NANNING, c.coord],
      students: c.students,
      city: c.name
    });
  }
});

    formatter: function(p){
